<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narya Agence — Matching influenceurs</title>
<style>
:root{--clay:#C1573B;--pine:#2E4034;--gold:#C79A56;--sand:#F3EBDD;--ink:#211D1A;--mute:#6f6558;--line:#e2d6c1;--card:#fffdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:"Liberation Sans",Arial,Helvetica,sans-serif;font-size:14px}
.serif{font-family:"Liberation Serif",Georgia,"Times New Roman",serif}
.top{background:var(--ink);color:var(--sand);display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
.brand{position:relative;display:inline-block;line-height:0}
.brand img{height:80px;width:auto;display:block}
.brand .sub{position:absolute;left:93px;top:61px;line-height:1;font-size:11px;letter-spacing:.07em;color:#cbbfae;white-space:nowrap}
@media(max-width:700px){.top .t{display:none}.brand img{height:64px}.brand .sub{left:74px;top:49px;font-size:9px}}
.top .t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.layout{max-width:1500px;margin:0 auto;padding:16px 24px}
@media(max-width:700px){.layout{padding:12px}}
.bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
#filters{display:contents}
.f{position:relative;width:148px}
.f.n{width:118px}.f.sr{flex:1;min-width:150px}
.f>label,.f>span.l{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.dd summary{list-style:none;cursor:pointer;padding:6px 24px 6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;height:32px;line-height:18px}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"▾";position:absolute;right:8px;top:6px;color:var(--mute)}
.dd[open] summary{border-color:var(--pine)}
.dd.on summary{background:var(--pine);border-color:var(--pine);color:var(--sand)}
.dd.on summary::after{color:var(--sand)}
.panel{position:absolute;left:0;top:calc(100% + 3px);min-width:100%;width:max-content;max-width:260px;z-index:30;border:1px solid var(--pine);border-radius:6px;max-height:240px;overflow-y:auto;background:#fff;box-shadow:0 8px 20px rgba(33,29,26,.18)}
.panel label{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;font-size:13px}
.panel label:hover{background:#f6efe1}
.panel input{accent-color:var(--pine);margin:0}
input.t,input.s{width:100%;font:inherit;font-size:13px;height:32px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{font:inherit;font-size:13px;height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--clay);background:transparent;color:var(--clay);cursor:pointer}
.btn:hover{background:var(--clay);color:#fff}
.btn.p{background:var(--pine);border-color:var(--pine);color:var(--sand)}.btn.p:hover{background:var(--ink);border-color:var(--ink)}
.active{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;margin-bottom:10px;align-items:center}
.active em{color:var(--mute);font-style:normal;font-size:12px}
.pill{background:#efe0bf;border:0;border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
.pill:hover{background:var(--gold)}
.tw{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:68vh}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1000px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;font-weight:400}
th{position:sticky;top:0;z-index:2;background:var(--pine);color:var(--sand);cursor:pointer;user-select:none}
tbody tr:nth-child(even){background:#faf4e8}tbody tr:hover{background:#f1e6d0}
td.id{color:var(--mute)}
.who{display:flex;align-items:center;gap:10px}
.av{position:relative;overflow:hidden;flex:none;width:30px;height:30px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;font-size:13px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px}.badge svg{width:22px;height:22px;flex:none}
.lk{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--clay);border:1px solid var(--line);background:#fff}
.lk:hover{background:var(--clay);color:#fff;border-color:var(--clay)}.lk svg{width:16px;height:16px}
.tag{display:inline-block;padding:2px 9px;margin-right:4px;border-radius:99px;background:#efe0bf;font-size:12px}
a{color:var(--clay);text-decoration:none}a:hover{text-decoration:underline}
.warn{color:var(--clay)}
.msg{padding:30px;text-align:center;color:var(--mute)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 0 20px}
</style>
</head>

  document.querySelectorAll("#filters input[type=checkbox]:checked").forEach(c=>(chosen[c.dataset.k]=chosen[c.dataset.k]||[]).push(c.value));
  const fmin=count($("fmin").value),emin=parseFloat($("emin").value.replace(",","."))||0;
  const smax=$("smax").value.trim()===""?Infinity:parseFloat($("smax").value.replace(",","."));
  const q=norm($("q").value);
  return{chosen,list:rows.filter(r=>Object.keys(chosen).every(k=>{const v=Array.isArray(r[k])?r[k]:[r[k]];return v.some(x=>chosen[k].includes(x))})&&
    r.followers>=fmin&&(r.engagement??0)>=emin&&(r.suspects===null||r.suspects<=smax)&&(!q||norm(r.nom).includes(q)))};
}
function render(){
  const {chosen,list}=filtered();
  document.querySelectorAll("#filters .dd").forEach(d=>{
    const v=[...d.querySelectorAll("input:checked")].map(c=>c.value);
    d.querySelector("summary").textContent=v.length?(v.length<=2?v.join(", "):v.length+" choisis"):"Tous";
    d.classList.toggle("on",v.length>0);
  });
  const pills=[];
  Object.entries(chosen).forEach(([k,vs])=>vs.forEach(v=>pills.push([`${LABEL[k]} : ${v}`,()=>{document.querySelectorAll("#filters input[type=checkbox]").forEach(c=>{if(c.dataset.k==k&&c.value==v)c.checked=false});render()}])));
  NUMS.forEach(([id,label])=>{const v=$(id).value.trim();if(v)pills.push([`${label.replace(/ \(%\)/,"")} : ${v}`,()=>{$(id).value="";render()}])});
  const A=$("active");A.innerHTML=pills.length?"":"<em>Aucune condition : tous les influenceurs sont affichés.</em>";
  pills.forEach(([t,fn])=>{const b=document.createElement("button");b.className="pill";b.textContent=t+"  ✕";b.onclick=fn;A.appendChild(b)});

  if(sortKey)list.sort((a,b)=>{const sk=sortKey=="reactions"?"likes":sortKey=="gender"?"fem":sortKey;let x=a[sk],y=b[sk];if(Array.isArray(x))x=x.join();if(Array.isArray(y))y=y.join();
    const d=typeof x==="number"||x===null?(x??-1)-(y??-1):String(x).localeCompare(String(y),"fr");return asc?d:-d});
  current=list;
  $("thead").innerHTML="<tr>"+COLS.map(([k,l])=>`<th data-k="${k}">${l}${sortKey===k?(asc?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  $("thead").querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=sortKey===k?!asc:true;sortKey=k;render()});
  $("tbody").innerHTML=list.map(r=>"<tr>"+COLS.map(([k])=>{const v=r[k];
    if(k=="id")return`<td class="id">${esc(v)}</td>`;
    if(k=="lien")return`<td>${v?`<a class="lk" href="${esc(v)}" target="_blank" rel="noopener" title="Ouvrir le profil" aria-label="Ouvrir le profil de ${esc(r.nom)}">${LINK}</a>`:""}</td>`;
    if(k=="nom")return`<td><div class="who"><span class="av">${esc((v.replace("@","")[0]||"?").toUpperCase())}${r.photo?`<img src="${esc(r.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</span>${esc(v)}</div></td>`;
    if(k=="plateforme")return`<td><span class="badge">${ICON[v]||""}${esc(v)}</span></td>`;
    if(k=="reactions")return`<td>${r.likes===null?"":`<span class="badge">${HEART}${fmtN(r.likes)}</span>`}${r.comments===null?"":`<span class="badge" style="margin-left:14px">${CMT}${fmtN(r.comments)}</span>`}</td>`;
    if(k=="gender")return`<td>${r.fem===null?"—":`<span class="badge">${FEM}${r.fem} %</span><span class="badge" style="margin-left:14px">${MAL}${r.hom} %</span>`}</td>`;
    if(k=="niche")return`<td>${v.map(n=>`<span class="tag">${esc(n)}</span>`).join("")}</td>`;
    if(k=="followers")return`<td>${v?fmtN(v):"—"}</td>`;
    if(k=="engagement")return`<td>${v===null?"—":v+" %"}</td>`;
    if(k=="suspects")return`<td class="${v>=40?"warn":""}">${v===null?"—":v+" %"}</td>`;
    return`<td>${esc(v??"")}</td>`}).join("")+"</tr>").join("");
  $("msg").style.display=list.length?"none":"block";
  if(!list.length)$("msg").textContent="Aucun influenceur ne correspond à ces conditions.";
}
function exportCSV(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const head=COLS.map(c=>q(c[1])).join(",");
  const body=current.map(r=>COLS.map(([k])=>q(Array.isArray(r[k])?r[k].join(", "):r[k])).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+head+"\n"+body],{type:"text/csv;charset=utf-8"}));
  a.download="matching-narya.csv";a.click();URL.revokeObjectURL(a.href);
}
function setRows(raw,keep){
  const st=keep?saveState():null;
  rows=raw.map(clean).filter(r=>r.nom);
  buildFilters();
  if(st){document.querySelectorAll("#filters input[type=checkbox]").forEach(c=>c.checked=st.c.includes(c.dataset.k+"|"+c.value));
    NUMS.forEach(([id],i)=>$(id).value=st.v[i]||"")}
  render();
}
async function load(first){
  if(!SHEET_CSV_URL){if(first)setRows(DEMO,false);return;}
  const fail=t=>{$("msg").style.display="block";$("msg").innerHTML="Impossible de lire le Google Sheet.<br><small>"+esc(t)+"</small>"};
  try{
    let res;
    try{res=await fetch(SHEET_CSV_URL,{cache:"no-store"})}catch(e){throw new Error("Connexion bloquée (réseau, bloqueur de pub ou ouverture en local) : "+e.message)}
    if(!res.ok)throw new Error("Erreur HTTP "+res.status+" : l'onglet n'est pas publié ou le lien est incorrect.");
    const txt=await res.text();
    if(/^\s*</.test(txt))throw new Error("Google renvoie une page web et non un CSV : republie l'onglet en format CSV.");
    const grid=parseCSV(txt);
    if(!grid.length)throw new Error("Le CSV est vide.");
    const data=toObjects(grid);
    setRows(data,!first);
    if(!rows.length)throw new Error("Aucun influenceur lu. En-têtes trouvés dans le Sheet : "+grid[0].join(" | "));
  }catch(e){fail(e.message||e)}
}
$("reset").onclick=()=>{document.querySelectorAll("#filters input[type=checkbox]").forEach(c=>c.checked=false);NUMS.forEach(([id])=>$(id).value="");$("q").value="";render()};
$("q").oninput=render;$("export").onclick=exportCSV;
load(true);setInterval(()=>load(false),REFRESH_MS);
</script>
